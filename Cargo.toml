[workspace]
members = ["libs/lewton", "libs/ogg"]

[package]
name = "pxtone"
version = "0.9.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
byteorder = "1.5.0"
lewton = { path = "libs/lewton" }
tinyvec = { version = "1", features = ["alloc"] }

[target.'cfg(all(not(target_feature = "atomics"), target_family = "wasm"))'.dependencies]
talc = "5.0.3"

[profile.release]
lto = true
codegen-units = 1

[profile.release-wasm]
inherits = "release"
panic = "abort"
strip = true

# The vorbis decoder only runs once per OGGV material while loading a file, so
# trade its code size against speed. This is worth about 11KB of wasm.
[profile.release-wasm.package.lewton]
opt-level = "z"

[profile.release-wasm.package.ogg]
opt-level = "z"

[dev-dependencies]
encoding_rs = "0.8.35"
toml = { version = "1.1.2", features = ["preserve_order"] }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "moo"
harness = false
